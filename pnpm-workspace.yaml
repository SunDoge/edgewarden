packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Security advisories fixed in transitive dependencies. Keep these scoped to
  # vulnerable ranges so future upstream major versions remain unconstrained.
  "undici@>=7.0.0 <7.29.1": 7.29.1
  "devalue@>=5.1.0 <5.9.3": 5.9.3
  # GHSA-rgj7-g3m4-5g8c: remove once Miniflare requires sharp >=0.35.4.
  "miniflare>sharp@<0.35.4": 0.35.4
  # GHSA-pxg6-pf52-xh8x: remove once SvelteKit requires cookie >=0.7.0.
  "@sveltejs/kit>cookie@<0.7.0": 0.7.2

auditConfig:
  ignoreGhsas:
    # Reviewed 2026-10-05: upstream lists no patched release; npm latest is
    # 3.0.3. Dependency path: kysely-codegen -> micromatch -> braces.
    # Used only by local database type generation, not the deployed Worker.
    # Remove this exception when a fixed release or codegen replacement exists.
    - GHSA-vfj7-8cjw-p6xm

allowBuilds:
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260804.0-alpha
  # This Wrangler version already existed in the reviewed Bun lockfile before
  # the pnpm migration, so it is not a newly introduced dependency update.
  - wrangler@4.120.1
  # Reviewed adapter release required by the D1/Kysely upgrade.
  - '@sundoge/kysely-d1@0.3.0'
