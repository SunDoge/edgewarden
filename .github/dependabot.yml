version: 2

updates:
  # The root pnpm lockfile covers all workspace packages.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # Kit 3 removes $lib and changes generated configuration; migrate separately.
      - dependency-name: "@sveltejs/kit"
        versions: ["3.x"]
      # Vitest 5 currently fails to start our Cloudflare worker test pool.
      - dependency-name: vitest
        versions: ["5.x"]
      # Keep TypeScript 6 until the Svelte/tooling ecosystem supports 7 directly.
      - dependency-name: typescript
        versions: ["7.x"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
