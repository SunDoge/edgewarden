name: Sync Bitwarden domain rules

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-bitwarden-domain-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Generated updates belong on the development branch and reach main
      # through the same reviewed release flow as application changes.
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm domains:sync
      - name: Commit updated rules
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/static/global_domains.bitwarden.json apps/api/src/static/global_domains.bitwarden.meta.json
          git commit -m "chore(domains): sync Bitwarden rules"
          git push origin HEAD:dev
